
<!DOCTYPE html>
<html>
<head>
    <title>Java Lab Academic Registry</title>
    <link rel="stylesheet" href="style.css">

    <style>
        body {
            background: #173f35;
            color: #fbf8ef;
            margin: 0;
            padding: 15px 30px;
            font-family: Arial, sans-serif;
        }

        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            max-width: 1000px;
            margin: auto;
            gap: 20px;
        }

        .details {
            text-align: left;
        }

        h1 {
            color: #fbf8ef;
            font-size: 25px;
            margin: 0 0 12px;
        }

        h2 {
            color: #d6c18e;
            margin: 5px 0;
            font-size: 22px;
        }

        p {
            color: #f1eadb;
            margin: 7px 0;
            font-size: 14px;
        }

        .profile-pic {
            width: 105px;
            height: 105px;
            border-radius: 50%;
            border: 3px solid #c5a96b;
            object-fit: cover;
            flex-shrink: 0;
        }

        @media (max-width: 500px) {
            body {
                padding: 12px;
            }

            h1 {
                font-size: 18px;
            }

            h2 {
                font-size: 18px;
            }

            p {
                font-size: 12px;
            }

            .profile-pic {
                width: 75px;
                height: 75px;
            }
        }
    </style>
</head>

<body>

    <div class="header">

        <div class="details">
            <h1>JAVA LAB ACADEMIC REGISTRY</h1>
            <h2>P. Kristi Marlin</h2>
            <p>Roll No: 25EU02109 | Department: AI & ML</p>
            <p>Faculty: Ramesh Sir | Academic Year: 2025–2029</p>
        </div>

        <img src="kristi Photo.jpg"
             alt="Kristi's Profile Photo"
             class="profile-pic">

    </div>

</body>
</html>
